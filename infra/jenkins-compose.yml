name: sembi-amir-ci
services:
  docker:
    image: docker:dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - docker-certs:/certs/client
      - docker-data:/var/lib/docker
      - jenkins-data:/var/jenkins_home
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "docker", "--host=unix:///var/run/docker.sock", "info"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
    restart: unless-stopped
  jenkins:
    build:
      context: .
      dockerfile: Jenkins.Dockerfile
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - jenkins-data:/var/jenkins_home
      - docker-certs:/certs/client:ro
    depends_on:
      docker:
        condition: service_healthy
    restart: unless-stopped
volumes:
  jenkins-data:
  docker-certs:
  docker-data:
